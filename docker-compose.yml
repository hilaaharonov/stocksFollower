version: "3.9"

services:
  backend:
    build: ./backend
    container_name: stocks_backend
    ports:
      - "8000:8000"
    environment:
      # Comma-separated list of ticker symbols to watch.
      # Change these to follow different stocks.
      - WATCHED_STOCKS=${WATCHED_STOCKS:-AAPL,MSFT,GOOGL}
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: stocks_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # Infinity datasource – queries any HTTP/JSON API (used to call the backend)
      - GF_INSTALL_PLUGINS=yesoreyeram-infinity-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  grafana_data:
