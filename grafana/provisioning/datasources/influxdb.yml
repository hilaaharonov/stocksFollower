apiVersion: 1

datasources:
  - name: InfluxDB
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: stocks
      defaultBucket: stocks
      tlsSkipVerify: true
    secureJsonData:
      token: my-super-secret-admin-token
    editable: true
    isDefault: true
