apiVersion: 1

datasources:
  - name: InfluxDB
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: stocks
      defaultBucket: stocks
      tlsSkipVerify: true
    secureJsonData:
    # NOTE: Override this token in production by rebuilding the container with
    # INFLUXDB_TOKEN set in your .env file (matches docker-compose.yml default).
    token: my-super-secret-admin-token
    editable: true
    isDefault: true
